name: Build Horizon Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Compilar Paquete del Cliente
      run: cargo build --release -p horizon-client

    - name: Subir Binarios Compilados
      uses: actions/upload-artifact@v4
      with:
        name: horizon-binaries-windows
        path: target/release/
